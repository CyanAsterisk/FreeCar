spring:
  application:
    name: trade_srv
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        format: YAML
        prefix: freecar
        default-context: java
        data-key: trade_srv
        watch:
          enabled: true
      discovery:
        enabled: true
        service-name: ${spring.application.name}
        port: ${server.port}
        metadata:
          thrift-ports: ${thrift.trade.port}
          api-port: ${server.port}
          service-type: both
        tags:
          - rpc-service
          - api-service
management:
  endpoint:
    health:
      show-details: always