spring:
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        format: YAML
        prefix: freecar
        default-context: java
        data-key: trade_srv
        watch:
          enabled: true
      discovery:
        enabled: true
        service-name: ${spring.application.name}
        port: ${server.port}
        health-check-path: /actuator/health